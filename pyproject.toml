[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-model-adaptation"
version = "0.1.0"
description = "Reproducible low-rank adaptation experiments on CPU"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Divyansh Gupta"}]
dependencies = ["torch>=2.5,<3", "numpy>=1.24,<3"]

[project.urls]
Repository = "https://github.com/meridian-max/efficient-model-adaptation"

[tool.setuptools.packages.find]
include = ["model_adaptation*"]
